<!DOCTYPE html>
<!-- 2D 픽셀 낚시게임 MVP. 단일 파일 실행 가능 (file:// OK) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>괴상한 낚시</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #150f1e; color: #e8dfc8; font-family: 'Press Start 2P', monospace; overflow: hidden; }
  #app { width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8px; overflow: hidden; gap: 0; }
  #hud { display: flex; gap: 18px; padding: 8px 14px; background: #1c1628; border: 1px solid #3a2e48; margin-bottom: 8px; font-size: 10px; width: min(1440px, calc((100vh - 100px) * 16 / 9), 96%); max-width: 96%; align-items: center; flex-shrink: 0; }
  #hud span b { color: #e8c870; }
  #stage { width: min(1440px, calc((100vh - 100px) * 16 / 9), 96%); max-width: 96%; aspect-ratio: 16/9; position: relative; background: #000; border: 2px solid #3a2e48; flex-shrink: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  .panel { position: absolute; inset: 0; background: #120d1c; padding: 16px; overflow-y: auto; display: none; }
  #panel-aquarium { background: rgba(8,14,22,0.82); backdrop-filter: blur(2px); transition: transform 0.3s ease; }
  #panel-aquarium.folded { transform: translateY(calc(100% - 46px)); }
  .panel.active { display: block; }
  .panel h2 { color: #c89858; margin-bottom: 12px; font-size: 15px; }
  .panel h3 { color: #6a5878; margin: 16px 0 8px; font-size: 11px; }
  .aqua-section { margin-bottom: 18px; border: 1px solid #3a2e48; padding: 12px; background: rgba(10,6,20,0.7); }
  .aqua-section.fresh { border-color: #284038; }
  .aqua-section h2 { font-size: 12px; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  .card { background: rgba(22,14,38,0.92); border: 2px solid #3a2e48; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 9px; height: 240px; overflow: hidden; }
  .card .name { color: #e8c870; font-size: 11px; flex-shrink: 0; }
  .card .meta { color: #7a6880; font-size: 9px; line-height: 1.6; flex-shrink: 0; }
  .card .flavor { color: #7a6880; font-size: 9px; line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .back-btn { padding: 8px 12px; background: #3c2858; color: #e8dfc8; border: 2px solid #5040a0; cursor: pointer; font-family: inherit; font-size: 10px; margin-bottom: 14px; display: inline-block; }
  .back-btn:hover { background: #5a40a0; }
  .card canvas { width: 56px; height: 56px; background: #0e0a18; align-self: center; image-rendering: pixelated; }
  .card button { padding: 7px 8px; background: #3c2858; color: #e8dfc8; border: 2px solid #5040a0; cursor: pointer; font-family: inherit; font-size: 9px; margin-top: auto; }
  .card button:hover { background: #5a40a0; }
  .card button.danger { background: #581828; border-color: #a03040; }
  .card button.danger:hover { background: #982030; }
  .card button:disabled { background: #201828; color: #4a3858; border-color: #2e2040; cursor: not-allowed; }
  .empty { color: #3a2e48; font-style: italic; padding: 12px; font-size: 9px; }
  #stage { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">

            <div class="grid" id="aqua-sea-list"></div>
          </div>
        </div>
        <div id="aqua-tab-fresh" style="display:none">
          <div class="aqua-section fresh">
            <h2>🌿 민물 수족관 (<span id="aqua-fresh-count">0</span>/<span id="aqua-fresh-cap">6</span>) · <span id="aqua-fresh-income">0</span>G/h</h2>
            <p style="color:#888;font-size:11px;margin-bottom:6px">민물 물고기만 입주 가능. 시간당 골드 수익.</p>
            <div class="grid" id="aqua-fresh-list"></div>
          </div>
        </div>
        <h3>인벤토리에서 옮기기</h3>
        <div class="grid" id="aqua-inv"></div>
      </div>
    </div>
    <div class="panel" id="panel-encyclopedia">
      <button class="back-btn" onclick="backToHarbor()">← 항구로</button>
      <h2>도감</h2>
      <p style="color:#888;font-size:12px;margin-bottom:8px">🌊 바다 · 🌿 민물 어종 전부 수집하세요.</p>
      <div class="grid" id="encyclopedia-list"></div>
    </div>
    <div class="panel" id="panel-shop">

      <h2>상점</h2>
      <h3>판매 (인벤토리)</h3>

        <span class="meta">모든 진행 삭제</span>
        <button class="danger" id="btn-reset">초기화</button>
      </div></div>
    </div>
  </div>
</div>

const defaultState = () => ({
  gold:0, inventory:[], aquarium_sea:[], aquarium_fresh:[],
  seenFish:[], upgrades:{rod:0,reel:0,bait:0,aqua_sea:0,aqua_fresh:0,boat:0},
  freshUnlocked:false,
  lastTick:Date.now(), nextInstId:1
});
let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw), d = defaultState();
    const ups = {...d.upgrades,...(s.upgrades||{})};
    // 구버전 inv_cap → boat 마이그레이션
    if ((s.upgrades||{}).inv_cap && !ups.boat) ups.boat = s.upgrades.inv_cap;
    const loaded = {...d,...s, upgrades:ups};
    // 기존 세이브 = freshUnlocked 이미 true 처리
    if (s.freshUnlocked === undefined) loaded.freshUnlocked = true;
    return loaded;
  } catch(e) { return defaultState(); }
}
function saveState() { state.lastTick = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function resetState() { localStorage.removeItem(SAVE_KEY); location.reload(); }

function maxDepth()      { return 340 + state.upgrades.rod * 120; }
function tensionCap()    { return 100 + state.upgrades.reel * 20; }
function seaAquaCap()    { return 6 + (state.upgrades.aqua_sea||0) * 3; }
function freshAquaCap()  { return 6 + (state.upgrades.aqua_fresh||0) * 3; }
function inventoryCap()  { return 5 + (state.upgrades.boat||0)*2; }
function boatSpeed()     { return 280 + (state.upgrades.boat||0)*30; }
function baitBias()      { return state.upgrades.bait * 0.1; }
function upgradeCost(k)  { const u = UPGRADES[k]; return Math.floor(u.baseCost * Math.pow(u.scale, state.upgrades[k]||0)); }

function weightedChoice(list, wfn) {
  const total = list.reduce((s,i) => s+wfn(i), 0);
  if (total <= 0) return list[0];
  let r = Math.random() * total;
  for (const item of list) { r -= wfn(item); if (r <= 0) return item; }
  return list[list.length-1];
}

const chests = [];
const CHEST_REWARDS = [{gold:100,w:50},{gold:300,w:30},{gold:500,w:15},{gold:1000,w:5}];
function spawnChest() {
  if (chests.length >= 2) return;
  chests.push({ x: 120 + Math.random()*(W-240), y: SURFACE_Y + maxDepth() - 12 });
}
function updateChests(dt) {
  if (chests.length < 2 && Math.random() < 0.0002) spawnChest();
}
function checkChestCollision() {
  for (let i=chests.length-1;i>=0;i--) {
    const c=chests[i];
    const dx=c.x-line.hookX, dy=c.y-line.hookY;
    if (dx*dx+dy*dy < 36*36) {
      const total=CHEST_REWARDS.reduce((s,r)=>s+r.w,0);
      let rnd=Math.random()*total;
      const reward=CHEST_REWARDS.find(r=>{rnd-=r.w;return rnd<=0;})||CHEST_REWARDS[0];
      state.gold+=reward.gold;
      flashHint(`보물상자 발견! +${reward.gold}G ✦`);
      chests.splice(i,1);
      saveState(); updateHUD();
      line.state='REELING';
      return;
    }
  }
}
function drawChests() {
  for (const c of chests) {
    const sy=toSY(c.y);
    const glow=0.12+0.08*Math.sin(gameTime*3);
    ctx.fillStyle=`rgba(255,210,40,${glow})`; ctx.beginPath(); ctx.arc(c.x,sy,32,0,Math.PI*2); ctx.fill();

function updateFirstCatch(dt) {
  if (!firstCatchAnim) return;
  firstCatchAnim.timer -= dt;
  for (const p of firstCatchAnim.parts) {
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 200*dt; // 중력
    p.life -= dt*0.45;
  }
  if (firstCatchAnim.timer <= 0) firstCatchAnim = null;
}
function drawFirstCatch() {
  if (!firstCatchAnim) return;
  const t = firstCatchAnim.timer;
  const alpha = Math.min(1, t * 0.8);
  // 어두운 오버레이
  ctx.fillStyle=`rgba(0,0,0,${0.55*alpha})`; ctx.fillRect(0,0,W,H);
  // 파티클
  for (const p of firstCatchAnim.parts) {
    if (p.life<=0) continue;
    ctx.globalAlpha = p.life * alpha;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = alpha;
  // 중앙 물고기 크게
  const scale = 1 + 0.3*Math.sin(gameTime*6);
  ctx.save(); ctx.translate(W/2, H/2-60); ctx.scale(scale*5, scale*5);
  drawShape(firstCatchAnim.fish.shape, firstCatchAnim.fish.color);
  ctx.restore();
  // 텍스트
  ctx.textAlign='center';
  ctx.fillStyle='#ffe070'; ctx.font=`bold ${fz(38)}px 'Press Start 2P',monospace`;
  ctx.shadowColor='#ff8800'; ctx.shadowBlur=24;
  ctx.fillText('★ 최초 발견! ★', W/2, H/2+60);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff'; ctx.font=`${fz(22)}px 'Press Start 2P',monospace`;
  ctx.fillText(firstCatchAnim.fish.name, W/2, H/2+100);
  ctx.fillStyle='#c8a84a'; ctx.font=`${fz(14)}px 'Press Start 2P',monospace`;
  ctx.fillText(`도감에 등록되었습니다`, W/2, H/2+130);
  ctx.textAlign='left';
  ctx.globalAlpha=1;
}

function handleHarborSpace() {
  if (harborPlayer.x <= 130) {
    if (!locationSelectMode) {
      locationSelectMode = true;
      locationSelectChoice = currentLoc;
    } else {
      if (locationSelectChoice==='fresh' && !state.freshUnlocked) {
        flashHint(`민물 잠금 해제 조건: 골드 10,000원 (현재 ${Math.floor(state.gold)}원)`);
        locationSelectChoice='sea';
        return;
      }
      const prevLoc = currentLoc;
      currentLoc = locationSelectChoice;
      locationSelectMode = false;
      if (currentLoc !== prevLoc) { fishes.length=0; chests.length=0; for(let i=0;i<6;i++) spawnFish(); }
      exitHarbor();
    }
    return;
  }
  locationSelectMode = false;
  for (const b of HARBOR_BUILDINGS) {
    if (Math.abs(harborPlayer.x - b.x) < 90) { switchTab(b.tab); return; }
  }
}
function updateHarborPlayer(dt) {
  if (!harborMode) return;
  if (locationSelectMode) return;
  if (keys['ArrowLeft']||keys['KeyA']) harborPlayer.x -= 300*dt;
  if (keys['ArrowRight']||keys['KeyD']) harborPlayer.x += 300*dt;
  harborPlayer.x = Math.max(30, Math.min(W-30, harborPlayer.x));
}

function spawnFish() {
  if (fishes.length >= MAX_FISH) return;
  const reachable = FISH_DB.filter(f => f.loc===currentLoc && f.depth[0] <= maxDepth());
  if (!reachable.length) return;
  const fish = weightedChoice(reachable, f => {
    const base = [1, 0.22, 0.038, 0.005, 0.0008][f.tier-1] ?? 0.0008;
    return base * (1 + baitBias() * (f.tier-1) * 0.9);
  });
  const isBottom = fish.shape==='crab'||fish.shape==='crayfish'||!!fish.bottom;
  const y = isBottom ? (SURFACE_Y+maxDepth()-20) : Math.max(SURFACE_Y+45, fish.depth[0] + Math.random()*(fish.depth[1]-fish.depth[0]));
  const dir = Math.random()<0.5 ? 1 : -1;
  fishes.push({ data:fish, x:dir<0?W+30:-30, y, vx:fish.speed*dir, wob:Math.random()*Math.PI*2, caught:false, bottom:isBottom });
}

function updateFishes(dt) {
  for (const f of fishes) {
    if (f.fleeing) {
      f.fleeTimer-=dt;
      if (f.fleeTimer<=0) f.fleeing=false;
      f.x+=f.vx*dt; f.y-=60*dt; // 도망 중 위로도 조금 이동
      continue;
    }
    f.x+=f.vx*dt;
    if (!f.bottom) { f.wob+=dt*3; f.y+=Math.sin(f.wob*1.4)*0.6; }
  }
  for (let i=fishes.length-1;i>=0;i--) { if (fishes[i].x<-80||fishes[i].x>W+80) fishes.splice(i,1); }
  if (fishes.length<MAX_FISH && Math.random()<0.05) spawnFish();
}

const swimSea=[], swimFresh=[], bubSea=[], bubFresh=[];
function syncAquariumSwimmers() {
  swimSea.length=0;
  for (const inst of state.aquarium_sea) {
    const fish=FISH_BY_ID[inst.fishId]; if(!fish) continue;
    const isBot=fish.shape==='crab'||fish.shape==='crayfish'||!!fish.bottom;
    swimSea.push({ data:fish, x:80+Math.random()*620, y:isBot?613:290+Math.random()*240, vx:(Math.random()*40+15)*(Math.random()<.5?1:-1), wob:Math.random()*Math.PI*2, t:Math.random()*3+2, bottom:isBot, startleTimer:0 });
  }
  swimFresh.length=0;
  for (const inst of state.aquarium_fresh) {
    const fish=FISH_BY_ID[inst.fishId]; if(!fish) continue;
    const isBot2=fish.shape==='crab'||fish.shape==='crayfish'||!!fish.bottom;
    swimFresh.push({ data:fish, x:870+Math.random()*620, y:isBot2?613:290+Math.random()*240, vx:(Math.random()*35+12)*(Math.random()<.5?1:-1), wob:Math.random()*Math.PI*2, t:Math.random()*3+2, bottom:isBot2, startleTimer:0 });
  }
}
function updateSwimmers(arr, minX, maxX, dt) {
  for (const f of arr) {
    f.x+=f.vx*dt; f.t-=dt;
    if (f.startleTimer>0) f.startleTimer-=dt;
    if (!f.bottom) { f.wob+=dt*2; f.y+=Math.sin(f.wob)*0.9; }
    if (f.t<=0) { f.vx=(Math.random()*40+20)*(Math.random()<.5?1:-1); f.t=Math.random()*3+2; }
    if (f.x<minX+10) f.vx=Math.abs(f.vx);
    if (f.x>maxX-10) f.vx=-Math.abs(f.vx);
  }
}
function updateAquarium(dt) {
  const fillBub = (arr, ox) => {
    while (arr.length<12) arr.push({x:ox+Math.random()*630, y:570, r:Math.random()*5+2, spd:Math.random()*14+18, a:0.25+Math.random()*0.35});
    for (const b of arr) {
      b.y-=b.spd*dt; b.a-=dt*0.08;
      if (b.y<240||b.a<=0) Object.assign(b,{x:ox+Math.random()*630,y:570,r:Math.random()*5+2,spd:Math.random()*14+18,a:0.25+Math.random()*0.35});
    }
  };
  fillBub(bubSea, 55); fillBub(bubFresh, 845);
  updateSwimmers(swimSea,   55, 730, dt);
  updateSwimmers(swimFresh, 845,1555, dt);
}

function initWeather() {

  for (let i=0;i<10;i++) weather.clouds.push({ x:Math.random()*W, y:40+Math.random()*80, scale:0.8+Math.random()*0.7, vx:8+Math.random()*12, opacity:0.35+Math.random()*0.2, thin:Math.random() });

function updateWeather(dt) {
  weather.timer+=dt;
  if (weather.timer>18) { weather.timer=0; const r=Math.random(); weather.mode=r<0.3?'rain':r<0.65?'cloudy':'clear'; }

function drawCloud(cloud) {
  const sy = 0.3+(1-cloud.thin)*0.7;
  ctx.save(); ctx.translate(cloud.x, cloud.y); ctx.scale(cloud.scale, cloud.scale*sy);
  ctx.fillStyle=`rgba(255,255,255,${cloud.opacity})`;
  ctx.beginPath();
  ctx.arc(0,0,28,0,Math.PI*2); ctx.arc(28,-3,22,0,Math.PI*2); ctx.arc(54,1,25,0,Math.PI*2);
  ctx.arc(80,-2,21,0,Math.PI*2); ctx.arc(14,-20,16,0,Math.PI*2); ctx.arc(40,-23,19,0,Math.PI*2); ctx.arc(65,-18,14,0,Math.PI*2);

// ========== 낚시 로직 ==========
function handleSpacePress() {
  if (harborMode) { handleHarborSpace(); return; }
  if ((currentTab==='sea'||currentTab==='fresh') && boat.x>=W-100 && line.state!=='HOOKED') { enterHarbor(); return; }
  if (currentTab!=='sea' && currentTab!=='fresh') return;
  if (line.state==='IDLE') {
    if (state.inventory.length>=inventoryCap()) { flashHint('인벤토리 가득. 상점에서 정리.'); return; }
    line.state='CASTING'; line.hookX=boat.x+42; line.hookY=boat.y-34; line.tension=0;
  } else if (line.state==='HOOKED') {
    line.escapeTimer=0;
    const tipX=boat.x+42;
    line.hookY-=14;
    line.hookX+=(tipX-line.hookX)*0.18;
    line.tension+=line.hookedFish.data.struggle;
    if (line.tension>=tensionCap()) { flashHint('줄 끊어짐! '+line.hookedFish.data.name+' 놓침'); const ef=line.hookedFish; ef.caught=false; ef.fleeing=true; ef.fleeTimer=2; ef.vx=(ef.x<W/2?-1:1)*ef.data.speed*4; line.hookedFish=null; line.state='REELING'; }
    if (line.hookY<=SURFACE_Y) { catchFish(line.hookedFish); line.hookedFish=null; line.state='IDLE'; }
  } else if (line.state==='CASTING') { line.state='REELING'; }
}

function checkHookCollision() {
  for (const fish of fishes) {
    if (fish.caught) continue;
    const dx=fish.x-line.hookX, dy=fish.y-line.hookY;
    if (dx*dx+dy*dy<34*34) {
      if (fish.data.minRod > state.upgrades.rod) {
        flashHint(`낚싯대 부족! ${fish.data.name}은 Lv.${fish.data.minRod} 필요`);
        line.state='REELING'; return;
      }
      fish.caught=true; line.hookedFish=fish; line.state='HOOKED'; line.escapeTimer=0; return;
    }
  }
}

function updateLine(dt) {
  if (line.state==='CASTING'||line.state==='HOOKED') {
    if (keys['ArrowLeft']||keys['KeyA']) line.hookX-=120*dt;
    if (keys['ArrowRight']||keys['KeyD']) line.hookX+=120*dt;
    line.hookX=Math.max(20,Math.min(W-20,line.hookX));
  }
  if (line.state==='CASTING') {
    line.hookY+=line.descendSpeed*dt;
    if (line.hookY>=SURFACE_Y+maxDepth()) line.state='REELING';
    checkHookCollision(); checkChestCollision();
  } else if (line.state==='HOOKED') {
    line.tension=Math.max(0,line.tension-35*dt);
    line.hookedFish.x=line.hookX; line.hookedFish.y=line.hookY;
    line.hookY+=20*dt;
    line.escapeTimer+=dt;
    if (line.escapeTimer>=3) { flashHint(line.hookedFish.data.name+' 도망갔다!'); const ef=line.hookedFish; ef.caught=false; ef.fleeing=true; ef.fleeTimer=2; ef.vx=(ef.x<W/2?-1:1)*ef.data.speed*4; line.hookedFish=null; line.state='REELING'; line.escapeTimer=0; }
    if (line.hookY>=SURFACE_Y+maxDepth()) { flashHint('너무 깊이 끌려감.'); line.hookedFish=null; line.state='REELING'; }
  } else if (line.state==='REELING') {
    line.hookY-=160*dt;
    const tipX=boat.x+42;
    line.hookX+=(tipX-line.hookX)*Math.min(1,3*dt);
    if (line.hookY<=boat.y-34) { line.hookY=SURFACE_Y; line.hookX=boat.x+42; line.state='IDLE'; }
    checkHookCollision();
  } else { line.hookX=boat.x+42; line.hookY=SURFACE_Y; }
}

function catchFish(fishEnt) {
  const isNew = !state.seenFish.includes(fishEnt.data.id);
  const inst={instId:state.nextInstId++, fishId:fishEnt.data.id};
  state.inventory.push(inst);
  if (isNew) state.seenFish.push(fishEnt.data.id);
  const idx=fishes.indexOf(fishEnt); if (idx>=0) fishes.splice(idx,1);
  const suffix = fishEnt.data.tier>=5?' !!!LEGENDARY!!!' : fishEnt.data.tier>=4?' [★희귀]' : '';
  flashHint('잡았다! '+fishEnt.data.name+suffix);
  if (isNew) {
    const cols=['#ffe070','#ff8844','#88eeff','#ff88cc','#aaffaa','#ffaaff','#ffffaa'];
    const parts=[];
    for(let i=0;i<40;i++){
      const a=Math.random()*Math.PI*2, spd=150+Math.random()*350;
      parts.push({x:W/2,y:H/2,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,col:cols[i%cols.length],r:4+Math.random()*6});
    }
    firstCatchAnim={timer:3.0,fish:fishEnt.data,parts};
  }
  saveState(); renderPanels();
}

function toSY(worldY) {
  if (worldY <= SURFACE_Y) return worldY;
  return SURFACE_Y + (worldY - SURFACE_Y) * (H - SURFACE_Y - 60) / maxDepth();
}

function draw() {

  }

    for (let i=0;i<4;i++) {

const ROD_COLORS = ['#8b5e2a','#7a7a9a','#1a1a2e','#c8a030','#00eeff'];
function drawBoat() {
  const x=boat.x, y=boat.y;
  const rodLv = state.upgrades.rod||0;
  const rodCol = ROD_COLORS[Math.min(rodLv, ROD_COLORS.length-1)];
  // 선체
  ctx.fillStyle='#7a5030'; ctx.beginPath(); ctx.moveTo(x-54,y+10); ctx.lineTo(x+54,y+10); ctx.lineTo(x+40,y+32); ctx.lineTo(x-40,y+32); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4a2e14'; ctx.fillRect(x-54,y+8,108,4);
  // 갑판 디테일
  ctx.fillStyle='#5a3820'; ctx.fillRect(x-38,y+12,76,3);
  // 돛대
  ctx.fillStyle='#3a2010'; ctx.fillRect(x-2,y-40,4,50);
  // 돛
  ctx.fillStyle='#f0f0f0'; ctx.beginPath(); ctx.moveTo(x+2,y-38); ctx.lineTo(x+30,y-4); ctx.lineTo(x+2,y-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.beginPath(); ctx.moveTo(x+2,y-38); ctx.lineTo(x+30,y-4); ctx.lineTo(x+2,y-4); ctx.closePath(); ctx.fill();
  // 선원
  ctx.fillStyle='#ffd9b3'; ctx.fillRect(x-24,y-12,8,8);
  ctx.fillStyle='#2d5a8a'; ctx.fillRect(x-26,y-4,12,14);
  ctx.fillStyle='#7a5020'; ctx.fillRect(x-26,y+10,5,5); ctx.fillRect(x-19,y+10,5,5);
  // ── 낚싯대 ──
  // 손잡이 (선원 옆)
  ctx.strokeStyle=rodCol; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+10,y+2); ctx.lineTo(x+42,y-34); ctx.stroke();
  // 가이드 링 (업그레이드 레벨마다 하나씩 더)
  ctx.strokeStyle='rgba(200,200,200,0.7)'; ctx.lineWidth=1.5;
  for(let i=0;i<=Math.min(rodLv,4);i++){
    const t=(i+1)/(6);
    const rx=x+10+(x+42-(x+10))*t, ry=y+2+(y-34-(y+2))*t;
    ctx.beginPath(); ctx.arc(rx,ry,2,0,Math.PI*2); ctx.stroke();
  }
  // 업그레이드 레벨 표시 (높은 레벨엔 글로우)
  if (rodLv >= 3) { ctx.shadowColor=rodCol; ctx.shadowBlur=8; }
  ctx.strokeStyle=rodCol; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+10,y+2); ctx.lineTo(x+42,y-34); ctx.stroke();
  ctx.shadowBlur=0;
}

function drawFish(f) {
  const s = f.vx>0 ? 1.1 : -1.1;
  ctx.save(); ctx.translate(f.x,toSY(f.y)); ctx.scale(s,1.1);
  drawShape(f.data.shape, f.data.color); ctx.restore();
}

// ========== 수족관 ==========
function drawTankBg(tx, ty, tw, th, c1, c2) {
  ctx.fillStyle='#050c14'; ctx.fillRect(tx,ty,tw,th);
  const g=ctx.createLinearGradient(0,ty,0,ty+th); g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fillRect(tx+4,ty+4,tw-8,th-8);
  // 빛 줄기
  ctx.save(); ctx.beginPath(); ctx.rect(tx+4,ty+4,tw-8,th-8); ctx.clip();
  for (let i=0;i<4;i++) {
    const rx=tx+40+i*(tw/4.2)+Math.sin(gameTime*0.45+i*1.3)*18, rw=28+Math.sin(gameTime*0.28+i*0.9)*8;
    const lg=ctx.createLinearGradient(rx,ty,rx+12,ty+th);
    lg.addColorStop(0,'rgba(200,240,255,0.12)'); lg.addColorStop(1,'rgba(200,240,255,0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(rx,ty); ctx.lineTo(rx+rw+16,ty+th); ctx.lineTo(rx+rw+28,ty+th); ctx.lineTo(rx+14,ty); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // 자갈
  for (let i=0;i<55;i++) {
    const gx=tx+8+(i%11)*Math.floor((tw-16)/11)+(i%3)*2, gy=ty+th-20+Math.sin(i*0.4)*3+(i%4)*2;
    ctx.fillStyle='#4b3e2d'; ctx.fillRect(gx,gy,12,6);
    ctx.fillStyle='#73604d'; ctx.fillRect(gx+2,gy+2,8,4);
  }
  // 식물
  for (let i=0;i<4;i++) {
    const bx=tx+30+i*Math.floor((tw-60)/4);
    ctx.strokeStyle='#6bbf74'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(bx,ty+th-20); ctx.quadraticCurveTo(bx-20,ty+th-70,bx+10,ty+th-120); ctx.quadraticCurveTo(bx+28,ty+th-150,bx+10,ty+th-180); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx+10,ty+th-20); ctx.quadraticCurveTo(bx+20,ty+th-70,bx+40,ty+th-130); ctx.quadraticCurveTo(bx+50,ty+th-155,bx+40,ty+th-178); ctx.stroke();
  }
}

function drawTankTop(tx, ty, tw) {
  // 파도
  ctx.save(); ctx.beginPath(); ctx.rect(tx+4,ty+4,tw-8,200); ctx.clip();
  const wb=ty+22;
  ctx.fillStyle='rgba(140,215,255,0.18)'; ctx.beginPath(); ctx.moveTo(tx+4,ty+4);
  for (let x=tx+4;x<=tx+tw-4;x+=3) { const wy=wb+Math.sin(x*0.022+gameTime*2.8)*6+Math.sin(x*0.038+gameTime*1.9)*3; ctx.lineTo(x,wy); }
  ctx.lineTo(tx+tw-4,ty+4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(210,245,255,0.5)'; ctx.lineWidth=1.5; ctx.beginPath();
  for (let x=tx+4;x<=tx+tw-4;x+=3) { const wy=wb+Math.sin(x*0.022+gameTime*2.8)*6+Math.sin(x*0.038+gameTime*1.9)*3; x===tx+4?ctx.moveTo(x,wy):ctx.lineTo(x,wy); }
  ctx.stroke(); ctx.restore();
}

function drawAquarium() {
  ctx.fillStyle='#09212f'; ctx.fillRect(0,0,W,H);
  const ty=180, th=460;
  // 바다 수족관 (왼쪽)
  drawTankBg(30,ty,740,th,'rgba(85,160,210,0.55)','rgba(10,25,55,0.95)');
  // 거품
  for (const b of bubSea) { ctx.fillStyle=`rgba(255,255,255,${b.a})`; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
  drawTankTop(30,ty,740);
  for (const f of swimSea) { ctx.save(); ctx.translate(f.x,f.y); ctx.scale(f.vx>0?1.3:-1.3,1.3); drawShape(f.data.shape,f.data.color); ctx.restore(); if(f.startleTimer>0){const a=Math.min(1,f.startleTimer/0.4);ctx.fillStyle=`rgba(255,80,80,${a})`;ctx.font=`bold ${fz(Math.floor(20+10*a))}px 'Press Start 2P',monospace`;ctx.textAlign='center';ctx.fillText('!',f.x,f.y-28);ctx.textAlign='left';} }
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=4; ctx.strokeRect(30,ty,740,th);
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1; ctx.strokeRect(34,ty+4,732,th-8);
  ctx.fillStyle='#c8d8f8'; ctx.font=`${fz(11)}px 'Press Start 2P',monospace`; ctx.fillText(`SEA  ${state.aquarium_sea.length}/${seaAquaCap()}`,44,ty+20);

  // 민물 수족관 (오른쪽)
  drawTankBg(830,ty,740,th,'rgba(45,160,130,0.55)','rgba(5,20,22,0.95)');
  for (const b of bubFresh) { ctx.fillStyle=`rgba(255,255,255,${b.a})`; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
  drawTankTop(830,ty,740);
  for (const f of swimFresh) { ctx.save(); ctx.translate(f.x,f.y); ctx.scale(f.vx>0?1.3:-1.3,1.3); drawShape(f.data.shape,f.data.color); ctx.restore(); if(f.startleTimer>0){const a=Math.min(1,f.startleTimer/0.4);ctx.fillStyle=`rgba(255,80,80,${a})`;ctx.font=`bold ${fz(Math.floor(20+10*a))}px 'Press Start 2P',monospace`;ctx.textAlign='center';ctx.fillText('!',f.x,f.y-28);ctx.textAlign='left';} }
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=4; ctx.strokeRect(830,ty,740,th);
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1; ctx.strokeRect(834,ty+4,732,th-8);
  ctx.fillStyle='#b8f0d8'; ctx.font=`${fz(11)}px 'Press Start 2P',monospace`; ctx.fillText(`RIVER  ${state.aquarium_fresh.length}/${freshAquaCap()}`,844,ty+20);
}

// ========== 형태 헬퍼 ==========
function drawShape(shape, color) {
  const m = {
    shark:drawShark, octopus:drawOctopus, jelly:drawJelly, bass:drawBass,
    squid:drawSquid, manta:drawManta, puffer:drawPuffer, turtle:drawTurtle,
    eel:drawEel, crab:drawCrab, shrimp:drawShrimp, whale:drawWhale,
    anglerfish:drawAnglerfish, kraken:drawKraken,
    catfish:drawCatfish, piranha:drawPiranha, carp:drawCarp,
    crayfish:drawCrayfish, sturgeon:drawSturgeon, salmon:drawSalmon,
    clownfish:drawClownfish, jellycold:drawJellycold, moray:drawMoray,
    flyingfish:drawFlyingfish, flatfish:drawFlatfish, rockfish:drawRockfish,
    sunfish:drawSunfish, mermaid:drawMermaid, rainbowdolphin:drawRainbowDolphin,
    spongebob:drawSpongebob, patrick:drawPatrick, bluewhale:drawBlueWhale,
    plainbass:drawPlainbass, bluegill:drawBluegill, minnow:drawMinnow,
    mullet:drawMullet, goldfish:drawGoldfish, trout:drawTrout,
    snakehead:drawSnakehead, breadfishred:drawBreadfishRed, breadfishcream:drawBreadfishCream,
    giantmudfish:drawGiantMudfish, goldencarp:drawGoldenCarp,
  };
  if (m[shape]) m[shape](color);
}

// ========== 바다 물고기 형태 ==========
function drawShark(color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(0,0,18,7,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-26,-8); ctx.lineTo(-26,8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2,-7); ctx.lineTo(2,-14); ctx.lineTo(6,-7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ff9eb5'; ctx.fillRect(10,-1,12,6);
  ctx.fillStyle='#fff'; for(let i=0;i<5;i++) ctx.fillRect(11+i*2,0,1,4);
  ctx.fillStyle='#000'; ctx.fillRect(6,-3,2,2);
}
function drawOctopus(color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(0,-4,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a0a05'; for(let i=-8;i<=8;i+=2) ctx.fillRect(i,-15,1,4);
  ctx.fillStyle='#000'; ctx.fillRect(-1,-14,2,6);
  ctx.fillStyle=color;
  for(let i=0;i<8;i++){const ang=(i/7-0.5)*Math.PI,ex=Math.cos(ang)*10,ey=Math.sin(ang)*4+8;ctx.beginPath();ctx.moveTo(0,4);ctx.quadraticCurveTo(ex*0.6,ey*0.5,ex,ey);ctx.lineWidth=2;ctx.strokeStyle=color;ctx.stroke();}
  ctx.fillStyle='#fff'; ctx.fillRect(-4,-5,3,3); ctx.fillRect(2,-5,3,3);
  ctx.fillStyle='#000'; ctx.fillRect(-3,-4,1,2); ctx.fillRect(3,-4,1,2);
}
function drawJelly(color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(-10,-2); ctx.lineTo(10,-2); ctx.lineTo(8,-10); ctx.lineTo(-8,-10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#a07040'; ctx.fillRect(-6,-8,12,1); ctx.fillRect(-6,-5,12,1);
  ctx.fillStyle='#f5d76e';
  for(let i=-8;i<=8;i+=4){ctx.beginPath();ctx.moveTo(i,-2);ctx.quadraticCurveTo(i+1,4,i,10);ctx.lineTo(i+2,10);ctx.quadraticCurveTo(i+3,4,i+2,-2);ctx.closePath();ctx.fill();}
}
function drawBass(color) {
  // 통통한 참치 몸통
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(0,1,20,13,0,0,Math.PI*2); ctx.fill();
  // 등지느러미 (뾰족)
  ctx.beginPath(); ctx.moveTo(-6,-13); ctx.lineTo(-2,-22); ctx.lineTo(8,-13); ctx.closePath(); ctx.fill();
  // 꼬리 (갈라진)
  ctx.fillStyle='#c8a030';
  ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(-30,-9); ctx.lineTo(-26,0); ctx.lineTo(-30,9); ctx.closePath(); ctx.fill();
  // 마요네즈 배 (흰 크림)
  ctx.fillStyle='rgba(255,255,248,0.82)'; ctx.beginPath(); ctx.ellipse(3,6,13,6,0.15,0,Math.PI*2); ctx.fill();
  // 마요 짜놓은 선
  ctx.strokeStyle='rgba(255,255,240,0.95)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,5); ctx.bezierCurveTo(-1,2,5,7,11,4); ctx.stroke();
  // 눈
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(13,-1,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(13,-1,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(14,-2,0.8,0,Math.PI*2); ctx.fill();
  // 입
  ctx.fillStyle='#b89028'; ctx.beginPath(); ctx.moveTo(19,2); ctx.lineTo(23,2); ctx.lineTo(22,5); ctx.lineTo(18,5); ctx.closePath(); ctx.fill();
}
function drawSquid(color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(0,-4,12,9,0,Math.PI,0,true); ctx.fill();
  ctx.fillStyle='#d7bad7'; ctx.beginPath(); ctx.moveTo(-12,-4); ctx.lineTo(-18,12); ctx.lineTo(-8,8); ctx.lineTo(-4,12); ctx.lineTo(0,8); ctx.lineTo(4,12); ctx.lineTo(8,8); ctx.lineTo(18,12); ctx.lineTo(12,-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(-4,-6,3,3); ctx.fillRect(3,-6,3,3);
  ctx.fillStyle='#000'; ctx.fillRect(-3,-4,1,2); ctx.fillRect(4,-4,1,2);
}
function drawManta(color) {
  // 전체 마름모 날개 실루엣 (머리=오른쪽, 꼬리=왼쪽, 날개=위아래)
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(28,0);                              // 머리
  ctx.bezierCurveTo(22,-14, 6,-56,-14,-52);      // 위날개 앞 경계
  ctx.bezierCurveTo(-26,-48,-28,-18,-24,0);      // 위날개 뒤 경계
  ctx.bezierCurveTo(-28,18,-26,48,-14,52);       // 아래날개 뒤 경계
  ctx.bezierCurveTo(6,56,22,14,28,0);            // 아래날개 앞 경계
  ctx.closePath(); ctx.fill();
  // 중앙 두꺼운 몸통 (볼록)
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(2,0,22,8,0,0,Math.PI*2); ctx.fill();
  // 머리 뿔 (cephalic fins)
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(22,-2); ctx.bezierCurveTo(28,-10,32,-20,27,-22); ctx.bezierCurveTo(23,-15,20,-8,19,-3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22, 2); ctx.bezierCurveTo(28, 10,32, 20,27, 22); ctx.bezierCurveTo(23, 15,20,  8,19,  3); ctx.closePath(); ctx.fill();
  // 꼬리 채찍
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-24,0); ctx.bezierCurveTo(-34,3,-46,-1,-54,15); ctx.stroke();
  // 신문지 줄 (날개 전체에 클립)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(28,0); ctx.bezierCurveTo(22,-14,6,-56,-14,-52); ctx.bezierCurveTo(-26,-48,-28,-18,-24,0); ctx.bezierCurveTo(-28,18,-26,48,-14,52); ctx.bezierCurveTo(6,56,22,14,28,0); ctx.closePath(); ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,0.13)'; ctx.lineWidth=1.2;
  for(let y=-50;y<=50;y+=5){ ctx.beginPath(); ctx.moveTo(-26,y); ctx.lineTo(26,y); ctx.stroke(); }
  ctx.restore();
  // 복부 흰 패치
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(4,0,18,7,0,0,Math.PI*2); ctx.fill();
  // 눈
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(18,-5,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(18,-5,1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(19,-6,0.7,0,Math.PI*2); ctx.fill();
}
function drawPuffer(color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#333'; ctx.fillRect(2,-6,4,3); ctx.fillStyle='#fff'; ctx.fillRect(-4,-7,3,3); ctx.fillRect(6,-7,3,3);
  ctx.fillStyle='#f9d86b';
  for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(Math.cos(a)*12,Math.sin(a)*12);ctx.lineTo(Math.cos(a)*16,Math.sin(a)*16);ctx.strokeStyle='#f7c550';ctx.lineWidth=2;ctx.stroke();}
}
function drawTurtle(color) {
  // 몸통
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(0,2,18,10,0,0,Math.PI*2); ctx.fill();
  // 등딱지
  ctx.fillStyle='#1a6040'; ctx.beginPath(); ctx.ellipse(0,-1,13,8,0,0,Math.PI*2); ctx.fill();
  // 육각형 패턴
  ctx.strokeStyle='#2a9060'; ctx.lineWidth=1;
  [[-8,-2],[0,-4],[8,-2],[4,3],[-4,3]].forEach(([ox,oy])=>{
    ctx.beginPath();
    for(let p=0;p<6;p++){const a=p*Math.PI/3;ctx[p?'lineTo':'moveTo'](ox+Math.cos(a)*3.5,oy+Math.sin(a)*3.5);}
    ctx.closePath(); ctx.stroke();
  });
  // 레이저 포 (등딱지에 장착)
  ctx.fillStyle='#334455'; ctx.fillRect(-3,-12,6,7);
  ctx.fillStyle='#556677'; ctx.fillRect(-2,-19,4,9);
  ctx.fillStyle='#7799aa'; ctx.fillRect(-1,-21,2,4);
  // 포 글로우
  ctx.fillStyle='rgba(68,200,255,0.35)'; ctx.beginPath(); ctx.arc(0,-21,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#44ccff'; ctx.fillRect(-1,-23,2,3);
  // 앞다리/뒷다리
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(-18,5,5,3,0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14,6,5,3,-0.3,0,Math.PI*2); ctx.fill();
  // 머리
  ctx.beginPath(); ctx.ellipse(17,1,6,5,0,0,Math.PI*2); ctx.fill();
  // 눈 (레이저 레드)
  ctx.fillStyle='rgba(255,50,0,0.35)'; ctx.beginPath(); ctx.arc(20,-1,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(20,-1,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff2200'; ctx.beginPath(); ctx.arc(20,-1,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(21,-2,0.8,0,Math.PI*2); ctx.fill();
}
function drawEel(color) {
  ctx.strokeStyle=color; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-24,0); ctx.bezierCurveTo(-14,-12,2,12,16,-4); ctx.stroke();
  ctx.lineWidth=4; ctx.strokeStyle=color+'aa';
  ctx.beginPath(); ctx.moveTo(-24,-5); ctx.bezierCurveTo(-14,-18,2,4,16,-10); ctx.stroke();
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(22,-2,8,6,-0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(24,-4,2,2); ctx.fillStyle='#000'; ctx.fillRect(24,-4,1,1);
}
function drawCrab(color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(0,2,15,10,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(24,-7); ctx.lineTo(28,-2); ctx.lineTo(26,4); ctx.lineTo(18,3); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c05030'; ctx.beginPath(); ctx.arc(27,-1,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-24,-7); ctx.lineTo(-28,-2); ctx.lineTo(-26,4); ctx.lineTo(-18,3); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c05030'; ctx.beginPath(); ctx.arc(-27,-1,4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=2;

function drawPatrick(color) {
  const pk='#f4846e';
  // 5각 별 몸통
  ctx.fillStyle=pk;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang=(i/10)*Math.PI*2-Math.PI/2;
    const r=i%2===0?24:10;
    if(i===0) ctx.moveTo(Math.cos(ang)*r,Math.sin(ang)*r);
    else ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
  }
  ctx.closePath(); ctx.fill();
  // 배 연한 부분
  ctx.fillStyle='rgba(255,210,190,0.4)';
  ctx.beginPath(); ctx.ellipse(0,2,10,8,0,0,Math.PI*2); ctx.fill();
  // 초록 팬티 (하단 별 팁 두 개 사이)
  ctx.fillStyle='#4a9a28';
  ctx.beginPath(); ctx.moveTo(-11,8); ctx.lineTo(11,8); ctx.lineTo(9,20); ctx.lineTo(-9,20); ctx.closePath(); ctx.fill();
  // 보라 꽃무늬
  ctx.fillStyle='#8040bb';
  ctx.beginPath(); ctx.arc(-4,14,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,14,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffe066';
  ctx.beginPath(); ctx.arc(-4,14,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,14,1.5,0,Math.PI*2); ctx.fill();
  // 눈 (큰 흰 동그라미)
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-5,-4,6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-4,6,0,Math.PI*2); ctx.fill();
  // 검은 눈동자
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-4,-3,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6,-3,3.5,0,Math.PI*2); ctx.fill();
  // 하이라이트
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-2.5,-4.5,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7.5,-4.5,1.5,0,Math.PI*2); ctx.fill();
  // 코
  ctx.fillStyle='#d87060'; ctx.beginPath(); ctx.ellipse(1,0,2.5,1.8,0,0,Math.PI*2); ctx.fill();
  // 웃는 입
  ctx.fillStyle='#cc1818';
  ctx.beginPath(); ctx.moveTo(-8,4); ctx.quadraticCurveTo(0,15,8,4); ctx.closePath(); ctx.fill();
  // 이빨
  ctx.fillStyle='#fff';
  ctx.fillRect(-6,4,4,4); ctx.fillRect(-1,4,4,4); ctx.fillRect(4,4,3.5,4);
}

function _drawBreadBody() {
  // 붕어빵 기본 몸통 (가로 잉어 실루엣) — 호출 전 color 세팅 필요

  ctx.beginPath();
  ctx.moveTo(20,0);

  ctx.bezierCurveTo(-18,-8,-18,8,-8,12);
  ctx.bezierCurveTo(4,18,20,14,20,0);

  ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(-22,-18); ctx.lineTo(-18,-4); ctx.lineTo(-22,16); ctx.lineTo(-8,8); ctx.closePath(); ctx.fill();

}
function drawBreadfishRed(color) {

  ctx.fillStyle='#c8721a'; _drawBreadBody();
  // 빵 틀 눌림 자국 (격자)
  ctx.save(); ctx.beginPath();
  ctx.moveTo(20,0); ctx.bezierCurveTo(20,-14,4,-18,-8,-12); ctx.bezierCurveTo(-18,-8,-18,8,-8,12); ctx.bezierCurveTo(4,18,20,14,20,0); ctx.closePath(); ctx.clip();

  for(let y=-16;y<=16;y+=6){ctx.beginPath();ctx.moveTo(-22,y);ctx.lineTo(22,y);ctx.stroke();}
  ctx.restore();
  // 팥 속 (입 부분에서 살짝 보임)
  ctx.fillStyle='#6a1a1a'; ctx.beginPath(); ctx.ellipse(17,0,5,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a03030'; ctx.beginPath(); ctx.ellipse(16,0,3,2.5,0,0,Math.PI*2); ctx.fill();

// ========== HUD / 패널 ==========
const hudGold=document.getElementById('hud-gold'), hudDepth=document.getElementById('hud-depth');
const hudInv=document.getElementById('hud-inv'), hudState=document.getElementById('hud-state');
const hudRod=document.getElementById('hud-rod');
const STATE_LABEL={IDLE:'대기',CASTING:'캐스팅',HOOKED:'걸림!',REELING:'회수'};
function updateHUD() {
  hudGold.textContent=Math.floor(state.gold);
  hudDepth.textContent=Math.floor(Math.max(0,line.hookY-SURFACE_Y));
  hudInv.textContent=state.inventory.length+'/'+inventoryCap();
  hudState.textContent=STATE_LABEL[line.state];
  hudRod.textContent='Lv.'+state.upgrades.rod;
}
const hintFlash={text:'',timer:0};
function flashHint(t){hintFlash.text=t;hintFlash.timer=3;}

let currentTab='sea';
function switchTab(t) {
  if (t==='sea'||t==='fresh') harborMode = false;
  currentTab=t;
  const prevLoc=currentLoc;
  if (t==='sea'||t==='fresh') currentLoc=t;
  if (currentLoc!==prevLoc) { fishes.length=0; for(let i=0;i<6;i++) spawnFish(); }
  ['aquarium','encyclopedia','shop'].forEach(p=>{document.getElementById('panel-'+p).classList.toggle('active',t===p);});
  renderPanels();
}
function backToHarbor() {
  ['aquarium','encyclopedia','shop'].forEach(p=>document.getElementById('panel-'+p).classList.remove('active'));
  currentTab=currentLoc;
}

function makeFishCard(inst, actions) {
  const fish=FISH_BY_ID[inst.fishId]; if(!fish) return document.createElement('div');
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<canvas width="48" height="48"></canvas><span class="name">${fish.name}</span><span class="meta">T${fish.tier} · ${fish.price}G · ${fish.loc==='sea'?'🌊':'🌿'}</span><span class="flavor">${fish.flavor}</span>`;
  const cv=card.querySelector('canvas'); const cctx=cv.getContext('2d'); cctx.imageSmoothingEnabled=false;
  cctx.clearRect(0,0,48,48); cctx.save(); cctx.translate(24,28); cctx.scale(1.2,1.2);
  miniShape(cctx,fish); cctx.restore();
  for (const act of actions) {
    const b=document.createElement('button'); b.textContent=act.label;
    if(act.danger)b.className='danger'; if(act.disabled)b.disabled=true;
    b.addEventListener('click',act.fn); card.appendChild(b);
  }
  return card;
}

function makeEncCard(fish, discovered) {
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<canvas width="48" height="48"></canvas><span class="name">${fish.loc==='sea'?'🌊':'🌿'} ${fish.name}</span><span class="meta">${discovered?'발견됨':'미발견'}</span><span class="flavor">${discovered?fish.flavor:'아직 못 잡았어요.'}</span>`;
  const cv=card.querySelector('canvas'); const cctx=cv.getContext('2d'); cctx.imageSmoothingEnabled=false;
  cctx.clearRect(0,0,48,48); cctx.save(); cctx.translate(24,28); cctx.scale(1.1,1.1);
  if(discovered){miniShape(cctx,fish);}else{cctx.fillStyle='#333';cctx.beginPath();cctx.arc(0,0,12,0,Math.PI*2);cctx.fill();}
  cctx.restore(); return card;
}

function renderPanels() {
  syncAquariumSwimmers();
  // 바다 수족관
  document.getElementById('aqua-sea-count').textContent=state.aquarium_sea.length;
  document.getElementById('aqua-sea-cap').textContent=seaAquaCap();
  document.getElementById('aqua-sea-income').textContent=state.aquarium_sea.reduce((s,inst)=>{const f=FISH_BY_ID[inst.fishId];return s+(f?f.price*3.6:0);},0).toFixed(1);
  const aS=document.getElementById('aqua-sea-list'); aS.innerHTML='';
  if(!state.aquarium_sea.length) aS.innerHTML='<div class="empty">바다 물고기가 없음.</div>';
  for(const inst of state.aquarium_sea) {
    aS.appendChild(makeFishCard(inst,[{label:'인벤으로',fn:()=>{
      if(state.inventory.length>=inventoryCap()){flashHint('인벤 가득.');return;}
      state.aquarium_sea=state.aquarium_sea.filter(x=>x.instId!==inst.instId);
      state.inventory.push(inst); saveState(); renderPanels();
    }}]));
  }
  // 민물 수족관
  document.getElementById('aqua-fresh-count').textContent=state.aquarium_fresh.length;
  document.getElementById('aqua-fresh-cap').textContent=freshAquaCap();
  document.getElementById('aqua-fresh-income').textContent=state.aquarium_fresh.reduce((s,inst)=>{const f=FISH_BY_ID[inst.fishId];return s+(f?f.price*3.6:0);},0).toFixed(1);
  const aF=document.getElementById('aqua-fresh-list'); aF.innerHTML='';
  if(!state.aquarium_fresh.length) aF.innerHTML='<div class="empty">민물 물고기가 없음.</div>';
  for(const inst of state.aquarium_fresh) {
    aF.appendChild(makeFishCard(inst,[{label:'인벤으로',fn:()=>{
      if(state.inventory.length>=inventoryCap()){flashHint('인벤 가득.');return;}
      state.aquarium_fresh=state.aquarium_fresh.filter(x=>x.instId!==inst.instId);
      state.inventory.push(inst); saveState(); renderPanels();
    }}]));
  }
  // 인벤 → 수족관
  const aI=document.getElementById('aqua-inv'); aI.innerHTML='';
  if(!state.inventory.length) aI.innerHTML='<div class="empty">인벤토리 비어있음.</div>';
  for(const inst of state.inventory) {
    const fish=FISH_BY_ID[inst.fishId]; if(!fish) continue;
    const isSea=fish.loc==='sea';
    const aqua=isSea?state.aquarium_sea:state.aquarium_fresh;
    const cap=isSea?seaAquaCap():freshAquaCap();
    aI.appendChild(makeFishCard(inst,[{label:`${isSea?'🌊바다':'🌿민물'} 수족관 배치`, disabled:aqua.length>=cap, fn:()=>{
      if(aqua.length>=cap) return;
      if(isSea) state.aquarium_sea.push(inst); else state.aquarium_fresh.push(inst);
      state.inventory=state.inventory.filter(x=>x.instId!==inst.instId);
      saveState(); renderPanels();
    }}]));
  }
  // 상점 - 판매
  const sI=document.getElementById('shop-inv'); sI.innerHTML='';
  if(!state.inventory.length) sI.innerHTML='<div class="empty">팔 물고기 없음.</div>';
  for(const inst of state.inventory) {
    const fish=FISH_BY_ID[inst.fishId]; if(!fish) continue;
    sI.appendChild(makeFishCard(inst,[{label:`판매 +${fish.price}G`,fn:()=>{
      state.gold+=fish.price; state.inventory=state.inventory.filter(x=>x.instId!==inst.instId);
      flashHint(`${fish.name} 판매 완료!`); saveState(); renderPanels();
    }}]));
  }
  // 도감
  const eL=document.getElementById('encyclopedia-list'); eL.innerHTML='';
  for(const fish of FISH_DB) eL.appendChild(makeEncCard(fish,state.seenFish.includes(fish.id)));
  // 업그레이드
  const sU=document.getElementById('shop-upgrades'); sU.innerHTML='';
  for(const key of Object.keys(UPGRADES)) {
    const u=UPGRADES[key], cost=upgradeCost(key), lvl=state.upgrades[key]||0;
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<span class="name">${u.name} Lv.${lvl}</span><span class="meta">${u.desc}</span><span class="meta">비용 ${cost}G</span>`;
    const b=document.createElement('button'); b.textContent='업그레이드'; b.disabled=state.gold<cost;
    b.addEventListener('click',()=>{if(state.gold<cost)return;state.gold-=cost;state.upgrades[key]=(state.upgrades[key]||0)+1;flashHint(`${u.name} 업그레이드!`);saveState();renderPanels();});
    card.appendChild(b); sU.appendChild(card);
  }
}

document.getElementById('btn-reset').addEventListener('click',()=>{if(confirm('정말 모든 진행 초기화?'))resetState();});

// ========== 패시브 수익 ==========
function tickPassive(dt) {
  let income=0;
  for(const inst of [...state.aquarium_sea,...state.aquarium_fresh]) {
    const fish=FISH_BY_ID[inst.fishId]; if(fish) income+=fish.price*0.001*dt;
  }
  state.gold+=income;
}
function applyOffline() {
  const now=Date.now(), dt=Math.min(60*60*4,(now-state.lastTick)/1000);
  if(dt>5) tickPassive(dt); state.lastTick=now;
}
applyOffline();

// ========== 게임 루프 ==========
let lastT=performance.now(), autoSaveT=0;
function loop(now) {
  updateFontScale();
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; gameTime+=dt;
  if (!harborMode) {
    if(keys['ArrowLeft']||keys['KeyA']) boat.x-=boatSpeed()*dt;
    if(keys['ArrowRight']||keys['KeyD']) boat.x+=boatSpeed()*dt;
    boat.x=Math.max(50,Math.min(W-50,boat.x));
  }
  updateHarborPlayer(dt);
  updateFishes(dt); updateLine(dt); updateWeather(dt); updateAquarium(dt); updateChests(dt); updateFirstCatch(dt); tickPassive(dt);
  if (!state.freshUnlocked && state.gold >= 10000) { state.freshUnlocked=true; flashHint('🎉 민물 해금! 항구에서 민물 선택 가능'); saveState(); }
  if(hintFlash.timer>0) hintFlash.timer-=dt;
  draw(); updateHUD();
  autoSaveT+=dt; if(autoSaveT>5){autoSaveT=0;saveState();}
  requestAnimationFrame(loop);
}

// ========== 브금 ==========
const bgm = new Audio('Sunset Dock Loop.mp3');
bgm.loop = true;
bgm.volume = 0.4;
let bgmStarted = false;
let bgmMuted = false;

function startBgm() {
  if (bgmStarted) return;
  bgmStarted = true;
  bgm.play().catch(() => {});
}
function toggleMute() {
  bgmMuted = !bgmMuted;
  bgm.muted = bgmMuted;
  document.getElementById('btn-mute').textContent = bgmMuted ? '♪ OFF' : '♪ ON';
  if (!bgmStarted) startBgm();
}

window.addEventListener('keydown', startBgm, { once: true });
window.addEventListener('click', startBgm, { once: true });

canvas.addEventListener('click', e => {
  if (currentTab !== 'aquarium') return;
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const cy = (e.clientY - rect.top)  * (canvas.height / rect.height);
  const all = [...swimSea, ...swimFresh];
  let hit = null, best = 45*45;
  for (const f of all) {
    const d2 = (f.x-cx)**2 + (f.y-cy)**2;
    if (d2 < best) { best=d2; hit=f; }
  }
  if (hit) {
    hit.vx = -Math.sign(hit.vx) * Math.max(Math.abs(hit.vx), 60) * 2.5;
    hit.t = 0.8;
    hit.startleTimer = 0.9;
  }
});

initWeather();
for(let i=0;i<6;i++) spawnFish();
renderPanels();
requestAnimationFrame(loop);
</script>
</body>
</html>
